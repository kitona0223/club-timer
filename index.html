<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB TIMER</title>
    <!-- 📱 ホーム画面用アイコンの設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <!-- ⏱️ デジタルタイマー風フォント (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: #090d16;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none; /* 誤作動防止：長押し選択を禁止 */
        }

        .timer-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 20px 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: bold;
        }

        /* 💡 スリープ防止インジケーター */
        .wake-lock-status {
            font-size: 11px;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            display: none;
        }

        /* ⏱️ 縦画面：超巨大デジタル表示 */
        .timer-display {
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            font-size: clamp(90px, 28vw, 160px);
            font-weight: bold;
            color: #facc15; /* 高発色イエロー */
            margin: 0 0 16px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            line-height: 0.85;
        }

        /* タイムアップ時の点滅アニメーション */
        .time-up {
            color: #ff3333 !important;
            animation: flash 0.6s infinite alternate;
            text-shadow: 0 0 40px rgba(255, 51, 51, 0.9);
        }

        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* 🔳 真四角ボタンパネル（2行×3列のクリアな仕切りレイアウト） */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 横3列 */
            gap: 12px; /* 誤タップ防止のためのしっかりした隙間 */
            padding: 10px;
            background-color: #0f172a;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        /* 🔲 真四角（正方形）ボタンデザイン */
        .btn {
            aspect-ratio: 1 / 1; /* 1:1 の完全な正方形 */
            width: 100%;
            padding: 8px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.08s ease;
            box-shadow: 0 5px 0px rgba(0,0,0,0.4); /* 立体的なボタン感 */
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ボタンを押したときの確実な手ごたえ（凹む） */
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px rgba(0,0,0,0.4);
        }

        .btn-icon {
            font-size: 24px;
            line-height: 1;
        }

        /* 🎨 誤操作を防ぐ明確な色分けと太枠 border */
        /* 上段：主要アクション */
        .btn-start { 
            background-color: #15803d; 
            color: #ffffff; 
            border: 2px solid #22c55e;
        }
        .btn-pause { 
            background-color: #b45309; 
            color: #ffffff; 
            border: 2px solid #f59e0b;
        }
        .btn-add { 
            background-color: #0369a1; 
            color: #ffffff; 
            border: 2px solid #38bdf8;
        }

        /* 下段：状態変更・危険操作 */
        .btn-reset { 
            background-color: #334155; 
            color: #cbd5e1; 
            border: 2px solid #64748b;
        }
        .btn-zero { 
            background-color: #be123c; 
            color: #ffffff; 
            border: 2px solid #f43f5e;
        }

        /* トグルボタン（ループ） */
        .btn-toggle {
            background-color: #1e1b4b;
            color: #a5b4fc;
            border: 2px solid #6366f1;
        }

        .btn-toggle.active {
            background-color: #6d28d9;
            color: #ffffff;
            border: 2px solid #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5), 0 5px 0px rgba(0,0,0,0.4);
        }

        /* 🔄 横画面（スマホを横にした時） */
        @media (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000000;
                height: 100vh;
                overflow: hidden;
            }

            .timer-card {
                max-width: 100vw;
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                background-color: #000000;
                box-shadow: none;
                padding: 2vh 2vw;

                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            /* 左側：操作パネルエリア（3列×2行の真四角ボタン） */
            .left-panel {
                width: 32vw;
                max-width: 360px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 8px;
            }

            .controls-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 8px;
            }

            .btn {
                font-size: 1.8vh;
                padding: 4px;
            }

            .btn-icon {
                font-size: 3vh;
            }

            /* 右側：タイマー表示エリア */
            .right-panel {
                flex: 1;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .timer-display {
                font-size: min(65vh, 23vw);
                margin: 0;
                letter-spacing: 0;
                line-height: 0.85;
                text-shadow: 0 0 60px rgba(250, 204, 21, 0.6);
            }
        }
    </style>
</head>
<body>

    <div class="timer-card">
        <!-- 左サイドパネル -->
        <div class="left-panel">
            <div class="header-status">
                <span style="letter-spacing:1px;">⏱️ CLUB TIMER</span>
                <span id="wakeLockBadge" class="wake-lock-status">💡 常時点灯中</span>
            </div>

            <!-- 🔳 3列×2行 の真四角ボタンエリア -->
            <div class="controls-grid">
                <!-- 上段：日常操作 -->
                <button class="btn btn-start" onclick="startTimer()">
                    <span class="btn-icon">▶</span>
                    <span>スタート</span>
                </button>

                <button class="btn btn-pause" onclick="pauseTimer()">
                    <span class="btn-icon">⏸</span>
                    <span>一時停止</span>
                </button>

                <button class="btn btn-add" onclick="addTime(1)">
                    <span class="btn-icon">＋1</span>
                    <span>1分追加</span>
                </button>

                <!-- 下段：設定・消去・ループ -->
                <button class="btn btn-reset" onclick="resetTimer()">
                    <span class="btn-icon">🔄</span>
                    <span>リセット</span>
                </button>

                <button class="btn btn-zero" onclick="setZero()">
                    <span class="btn-icon">🧹</span>
                    <span>0分クリア</span>
                </button>

                <button id="loopBtn" class="btn btn-toggle" onclick="toggleLoop()">
                    <span class="btn-icon">🔁</span>
                    <span>ループ</span>
                </button>
            </div>
        </div>

        <!-- 右サイドパネル -->
        <div class="right-panel">
            <div id="display" class="timer-display">10:00</div>
        </div>
    </div>

    <script>
        let totalSeconds = 600;      // 現在の残り秒数
        let initialSeconds = 600;    // リセット用の初期設定値
        let timerId = null;
        let isRunning = false;
        let isLoop = false;          // ループモード
        let wakeLock = null;         // 画面スリープ防止ロック

        const displayEl = document.getElementById('display');
        const loopBtn = document.getElementById('loopBtn');
        const wakeLockBadge = document.getElementById('wakeLockBadge');

        // 💡 画面スリープ防止機能
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockBadge.style.display = 'inline-block';
                }
            } catch (err) {
                console.log('Wake Lock Error:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    wakeLockBadge.style.display = 'none';
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });

        // 時間表示の更新
        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            displayEl.innerText = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        // ① スタート
        async function startTimer() {
            if (isRunning || totalSeconds <= 0) return;

            isRunning = true;
            displayEl.classList.remove('time-up');
            await requestWakeLock();

            timerId = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                }

                if (totalSeconds <= 0) {
                    playAlarmSound();
                    
                    if (isLoop && initialSeconds > 0) {
                        totalSeconds = initialSeconds;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        displayEl.classList.add('time-up');
                        releaseWakeLock();
                    }
                }
            }, 1000);
        }

        // ② 一時停止
        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            releaseWakeLock();
        }

        // ③ リセット
        function resetTimer() {
            pauseTimer();
            displayEl.classList.remove('time-up');
            totalSeconds = initialSeconds;
            updateDisplay();
        }

        // ④ +1分追加
        function addTime(minutes) {
            totalSeconds += minutes * 60;
            initialSeconds = totalSeconds;
            displayEl.classList.remove('time-up');
            updateDisplay();
        }

        // ⑤ 0分にセット (クリア)
        function setZero() {
            pauseTimer();
            displayEl.classList.remove('time-up');
            totalSeconds = 0;
            initialSeconds = 0;
            updateDisplay();
        }

        // ⑥ ループ 切り替え
        function toggleLoop() {
            isLoop = !isLoop;
            if (isLoop) {
                loopBtn.classList.add('active');
            } else {
                loopBtn.classList.remove('active');
            }
        }

        // 🔊 アラーム音
        function playAlarmSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            
            const ctx = new AudioContext();
            
            function beep(freq, duration, delay) {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                }, delay);
            }

            beep(880, 0.15, 0);
            beep(880, 0.15, 300);
            beep(880, 0.15, 600);
            beep(1760, 0.8, 900);
        }

        // 初期表示
        updateDisplay();
    </script>
</body>
</html>
