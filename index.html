<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB TIMER</title>
    <!-- 📱 ホーム画面用アイコンの設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <!-- ⏱️ デジタルタイマー風フォント (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .timer-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: bold;
        }

        /* ⏱️ デジタル時計フォント表示 (縦画面：画面幅いっぱいに拡大) */
        .timer-display {
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            font-size: clamp(80px, 22vw, 120px);
            font-weight: bold;
            color: #facc15; /* 高発色イエロー */
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.4);
            line-height: 1;
        }

        /* タイムアップ時の点滅アニメーション */
        .time-up {
            color: #ff3333 !important;
            animation: flash 0.6s infinite alternate;
            text-shadow: 0 0 35px rgba(255, 51, 51, 0.8);
        }

        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* 🔘 ボタンパネル（グリッドレイアウト 2列×3行） */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 14px 8px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-start { background-color: #16a34a; color: #ffffff; }
        .btn-pause { background-color: #d97706; color: #ffffff; }
        .btn-reset { background-color: #475569; color: #ffffff; }
        .btn-add   { background-color: #0284c7; color: #ffffff; }
        .btn-zero  { background-color: #e11d48; color: #ffffff; } /* 0分(クリア)用ボタン */

        /* トグルボタン（ループ） */
        .btn-toggle {
            background-color: #334155;
            color: #94a3b8;
            border: 1px solid #475569;
        }

        .btn-toggle.active {
            background-color: #8b5cf6;
            color: #ffffff;
            border-color: #a78bfa;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        /* 🔄 横画面（スマホを横にした時）：左サイドボタン / 右サイド超巨大タイマー */
        @media (orientation: landscape) {
            body {
                padding: 0;
                background-color: #000000;
                height: 100vh;
                overflow: hidden;
            }

            .timer-card {
                max-width: 100vw;
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                background-color: #000000;
                box-shadow: none;
                padding: 2vh 3vw;

                /* 左に設定ボタン、右に巨大タイマーを配置 */
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            /* 左側：操作パネルエリア */
            .left-panel {
                width: 30vw;
                max-width: 320px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 10px;
            }

            .controls-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .btn {
                padding: 2.2vh 0;
                font-size: 2.3vh;
            }

            /* 右側：タイマー表示エリア */
            .right-panel {
                flex: 1;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* 💥 遠くからでも超くっきり見える最大級数字 (48vh) */
            .timer-display {
                font-size: 48vh;
                margin: 0;
                letter-spacing: 4px;
                text-shadow: 0 0 45px rgba(250, 204, 21, 0.6);
            }
        }
    </style>
</head>
<body>

    <div class="timer-card">
        <!-- 左サイドパネル（横画面時：左側 / 縦画面時：下部） -->
        <div class="left-panel">
            <div class="header-status">
                <span style="letter-spacing:1px;">⏱️ CLUB TIMER</span>
            </div>

            <!-- 6つの設定ボタン -->
            <div class="controls-grid">
                <!-- ① スタート -->
                <button class="btn btn-start" onclick="startTimer()">▶ スタート</button>
                
                <!-- ② 一時停止 -->
                <button class="btn btn-pause" onclick="pauseTimer()">⏸ 一時停止</button>

                <!-- ③ リセット -->
                <button class="btn btn-reset" onclick="resetTimer()">🔄 リセット</button>

                <!-- ④ +1分 -->
                <button class="btn btn-add" onclick="addTime(1)">＋1分</button>

                <!-- ⑤ 0分 (クリア) -->
                <button class="btn btn-zero" onclick="setZero()">🧹 0分 (クリア)</button>

                <!-- ⑥ ループ -->
                <button id="loopBtn" class="btn btn-toggle" onclick="toggleLoop()">🔁 ループ</button>
            </div>
        </div>

        <!-- 右サイドパネル（横画面時：右側 / 縦画面時：上部） -->
        <div class="right-panel">
            <div id="display" class="timer-display">10:00</div>
        </div>
    </div>

    <script>
        let totalSeconds = 600;      // 現在の残り秒数 (初期値 10分)
        let initialSeconds = 600;    // リセット用の初期設定値
        let timerId = null;
        let isRunning = false;
        let isLoop = false;          // ループモード

        const displayEl = document.getElementById('display');
        const loopBtn = document.getElementById('loopBtn');

        // 時間表示の更新
        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            displayEl.innerText = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        // ① スタート
        function startTimer() {
            if (isRunning || totalSeconds <= 0) return; // 0秒の時はスタートしない

            isRunning = true;
            displayEl.classList.remove('time-up');

            timerId = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                }

                if (totalSeconds <= 0) {
                    playAlarmSound();
                    
                    if (isLoop && initialSeconds > 0) {
                        // ループON：初期時間に戻して再スタート
                        totalSeconds = initialSeconds;
                        updateDisplay();
                    } else {
                        // ループOFF：停止して点滅通知
                        clearInterval(timerId);
                        isRunning = false;
                        displayEl.classList.add('time-up');
                    }
                }
            }, 1000);
        }

        // ② 一時停止
        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
        }

        // ③ リセット（前回の設定時間に戻す）
        function resetTimer() {
            pauseTimer();
            displayEl.classList.remove('time-up');
            totalSeconds = initialSeconds;
            updateDisplay();
        }

        // ④ +1分追加
        function addTime(minutes) {
            totalSeconds += minutes * 60;
            initialSeconds = totalSeconds;
            displayEl.classList.remove('time-up');
            updateDisplay();
        }

        // ⑤ 0分にセット (クリア)
        function setZero() {
            pauseTimer();
            displayEl.classList.remove('time-up');
            totalSeconds = 0;
            initialSeconds = 0;
            updateDisplay();
        }

        // ⑥ ループ 切り替え
        function toggleLoop() {
            isLoop = !isLoop;
            if (isLoop) {
                loopBtn.classList.add('active');
            } else {
                loopBtn.classList.remove('active');
            }
        }

        // 🔊 Web Audio APIによるアラーム音
        function playAlarmSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            
            const ctx = new AudioContext();
            
            function beep(freq, duration, delay) {
                setTimeout(() => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.stop(ctx.currentTime + duration);
                }, delay);
            }

            beep(880, 0.15, 0);
            beep(880, 0.15, 300);
            beep(880, 0.15, 600);
            beep(1760, 0.8, 900);
        }

        // 初期表示
        updateDisplay();
    </script>
</body>
</html>
